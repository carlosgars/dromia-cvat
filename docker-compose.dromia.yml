services:
  cvat_ui:
    image: dromia/cvat-ui:${DROMIA_CVAT_UI_VERSION:-local}
    build:
      context: .
      dockerfile: Dockerfile.ui

  dromia_proxy:
    image: nginx:1.29-alpine
    container_name: dromia_proxy
    restart: always
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./dromia-nginx.conf:/etc/nginx/nginx.conf:ro
    labels:
      traefik.enable: "true"
      traefik.http.routers.dromia.rule: Host(`${CVAT_HOST:-localhost}`) && PathPrefix(`/dromia`)
      traefik.http.routers.dromia.priority: "100"
      traefik.http.routers.dromia.middlewares: dromia-strip
      traefik.http.middlewares.dromia-strip.stripprefix.prefixes: /dromia
      traefik.http.services.dromia.loadbalancer.server.port: "80"
    networks:
      - cvat
