name: DromIA CVAT UI

on:
  push:
  pull_request:

jobs:
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: yarn
      - run: corepack enable
      - run: DISABLE_HUSKY=1 yarn install --immutable
      - run: yarn type-check
      - run: yarn tsc --project cvat-ui/tests/tsconfig.dromia.json --noEmit
      - run: yarn test:dromia
      - run: yarn build:cvat-ui
